{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card auth-card">
    <div class="tabs">
        <a class="tab active" href="{{ url_for('auth.login') }}">Log In</a>
        <a class="tab" href="{{ url_for('auth.register') }}">Register</a>
    </div>
    <h2 class="auth-title">Welcome Back</h2>
    <p class="auth-sub">Enter your credentials to access your projects</p>
    <form method="POST">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="alex@company.com" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" class="btn btn-block">Sign In to Account</button>
    </form>
</div>
{% endblock %}
