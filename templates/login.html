{% extends "base.html" %}

{% block title %}Login - MVCS{% endblock %}

{% block page_class %}auth-page{% endblock %}

{% block content %}

<div class="auth-card">
    <h1>Welcome back</h1>
    <p class="auth-sub">Log in to manage your projects and file versions.</p>
    <p class="auth-switch"><a href="{{ url_for('home') }}">&larr; Back to home</a></p>

    <form method="POST">
        <label for="email">Email</label>
        <input type="email" name="email" id="email" required>

        <label for="password">Password</label>
        <input type="password" name="password" id="password" required>

        <button type="submit">Login</button>
    </form>

    <p class="auth-switch">
        Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a>
    </p>
</div>

{% endblock %}
