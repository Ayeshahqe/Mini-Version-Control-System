{% extends "base.html" %}
{% block title %}Upload New Version{% endblock %}
{% block content %}
<div class="card auth-card" style="max-width:640px">
    <h2 class="auth-title">Upload New Version</h2>
    <p class="auth-sub">File: {{ file.filename }}</p>
    <form method="POST" action="" enctype="multipart/form-data">
        <div class="dropzone" style="margin-top:22px">
            <input type="file" name="file" required>
            <span class="dz-icon">&#8679;</span>
            <strong>Drag &amp; drop the updated file, or <u>browse</u></strong>
            <small>Max 20 KB</small>
        </div>
        <button type="submit" class="btn btn-block">Upload Version</button>
        <a href="{{ url_for('version.history', file_id=file.id) }}" class="btn btn-light btn-block"
            style="text-align:center">Cancel</a>
    </form>
</div>
{% endblock %}
