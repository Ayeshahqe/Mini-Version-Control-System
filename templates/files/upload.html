{% extends "base.html" %}
{% block title %}Upload File{% endblock %}
{% block content %}
<div class="card auth-card" style="max-width:640px">
    <h2 class="auth-title">Upload File</h2>
    <p class="auth-sub">Project: {{ project.name }}</p>
    <form method="POST" action="" enctype="multipart/form-data">
        <div class="dropzone" style="margin-top:22px">
            <input type="file" name="file" required>
            <span class="dz-icon">&#8679;</span>
            <strong>Drag &amp; drop a file here, or <u>browse</u></strong>
            <small>Max 20 KB</small>
        </div>
        <button type="submit" class="btn btn-block">Upload</button>
        <a href="{{ url_for('file.list_files', project_id=project.id) }}" class="btn btn-light btn-block"
            style="text-align:center">Cancel</a>
    </form>
</div>
{% endblock %}
