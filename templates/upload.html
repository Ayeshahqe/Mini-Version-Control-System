{% extends "base.html" %}

{% block title %}Upload File - MVCS{% endblock %}

{% block content %}

<div class="card">

    <h1>Upload File</h1>

    <p>Project: {{ project.name }}</p>

    <form method="POST" enctype="multipart/form-data">

        <label>Select file</label>

        <input type="file" name="file" required>

        <button type="submit">
            Upload File
        </button>

    </form>

    <br>

    <a class="btn btn-secondary" href="{{ url_for('auth.project', project_id=project.id) }}">
        Back to Project
    </a>

</div>

{% endblock %}
