{% extends "base.html" %}

{% block title %}Upload File - MVCS{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Upload File</h1>
        <p>Project: {{ project.name }}</p>
    </div>
</div>

<div class="card form-card">
    <form method="POST" enctype="multipart/form-data">
        <label for="file">Choose a file</label>
        <input type="file" name="file" id="file" required>
        <p class="hint">Maximum size 200 KB. This upload becomes Version 1.</p>

        <div class="actions">
            <button type="submit">Upload</button>
            <a class="btn btn-secondary" href="{{ url_for('auth.project', project_id=project.id) }}">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
