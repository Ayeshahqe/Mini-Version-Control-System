{% extends "base.html" %}

{% block title %}Create Project - MVCS{% endblock %}

{% block content %}

<div class="card">
    <h1>Create New Project</h1>

    <form method="POST">
        <label for="name">Project Name</label>
        <input type="text" name="name" id="name" placeholder="Enter project name" required>

        <div class="actions">
            <button type="submit">Create Project</button>
            <a class="btn btn-secondary" href="{{ url_for('dashboard') }}">Back to Dashboard</a>
        </div>
    </form>
</div>

{% endblock %}
