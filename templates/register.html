{% extends "base.html" %}

{% block title %}Register - MVCS{% endblock %}

{% block page_class %}auth-page{% endblock %}

{% block content %}

<div class="auth-card">
    <h1>Create your account</h1>
    <p class="auth-sub">Start tracking your file versions in minutes.</p>
    <p class="auth-switch"><a href="{{ url_for('home') }}">&larr; Back to home</a></p>

    <form method="POST">
        <label for="name">Name</label>
        <input type="text" name="name" id="name" required>

        <label for="email">Email</label>
        <input type="email" name="email" id="email" required>

        <label for="password">Password</label>
        <input type="password" name="password" id="password" required>

        <button type="submit">Register</button>
    </form>

    <p class="auth-switch">
        Already have an account? <a href="{{ url_for('auth.login') }}">Login</a>
    </p>
</div>

{% endblock %}
